name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    name: orchestrator · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json
      - run: npm ci
        working-directory: orchestrator
      - run: npm run typecheck
        working-directory: orchestrator

  ui:
    name: ui · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  node-image:
    name: node-desktop · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: node-desktop
          push: false
          tags: tao-desktop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
